<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Uma Churrasqueira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <!-- ======================== LOGIN ======================== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">Uma Churrasqueira</div>
      <p class="login-sub">Admin Panel</p>
      <label class="login-label" for="loginPw">Password</label>
      <input class="login-input" type="password" id="loginPw" placeholder="Enter password" autocomplete="current-password" />
      <button class="login-btn" id="loginBtn">Sign In</button>
      <p class="login-error" id="loginError">Incorrect password. Try again.</p>
    </div>
  </div>

  <!-- ======================== ADMIN SHELL ======================== -->
  <div class="admin-shell" id="adminShell">

    <!-- Top bar -->
    <header class="admin-topbar">
      <span class="admin-topbar-brand">🔥 Uma Churrasqueira Admin</span>
      <div class="admin-topbar-right">
        <span class="unsaved-badge" id="unsavedDot" title="Unsaved changes"></span>
        <button class="btn-admin btn-gold" id="exportBtn">💾 Save Menu</button>
        <a href="menu.html" target="_blank" class="btn-admin btn-outline" style="text-decoration:none;">👁 View Menu</a>
        <button class="btn-admin btn-outline" id="logoutBtn">Logout</button>
      </div>
    </header>

    <!-- Body -->
    <div class="admin-body">

      <!-- Sidebar -->
      <nav class="admin-sidebar" id="adminSidebar">
        <p class="sidebar-label">Sections</p>
        <!-- Populated by JS -->
      </nav>

      <!-- Main -->
      <main class="admin-main" id="adminMain">
        <p style="color:rgba(255,255,255,0.3);margin-top:40px;text-align:center;">Select a section from the sidebar.</p>
      </main>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/admin.js"></script>
</body>
</html>
