<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu — Uma Churrasqueira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Lato:wght@300;400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/menu.css" />
</head>
<body class="menu-page">

  <!-- Mobile nav overlay -->
  <div class="nav-overlay" id="navOverlay"></div>

  <!-- NAV -->
  <nav class="navbar scrolled" id="navbar">
    <div class="nav-brand">
      <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;">
        <span class="nav-flame">🔥</span>
        <span class="nav-name">Uma Churrasqueira</span>
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#reviews">Reviews</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
  </nav>

  <!-- MENU HERO -->
  <div class="menu-hero">
    <div class="menu-hero-content">
      <span class="section-label light">Uma Churrasqueira</span>
      <h1 class="menu-hero-title">Our Menu</h1>
      <p class="menu-hero-sub">Barbecue &amp; Beer · Portugal &amp; Nepal</p>
    </div>
  </div>

  <!-- STICKY TABS -->
  <div class="menu-tabs-wrap" id="menuTabsWrap">
    <div class="menu-tabs-inner">
      <div class="menu-tabs" id="menuTabs">
        <button class="tab-btn active" data-target="starters">Starters</button>
        <button class="tab-btn" data-target="grilled">Grilled Meats</button>
        <button class="tab-btn" data-target="chicken-menu">Chicken Menu</button>
        <button class="tab-btn" data-target="pork-menu">Pork Menu</button>
        <button class="tab-btn" data-target="curry">Curry</button>
        <button class="tab-btn" data-target="fish">Fish</button>
        <button class="tab-btn" data-target="sides">Sides</button>
        <button class="tab-btn" data-target="drinks">Drinks</button>
      </div>
    </div>
  </div>

  <main class="menu-main">
    <div class="container">
      <div id="menu-content">
        <p class="menu-loading" style="color:rgba(255,255,255,0.4);padding:60px 0;text-align:center;">Loading menu…</p>
      </div>
    </div>
  </main>

  <footer class="footer" style="padding-top:40px;">
    <div class="container">
      <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,0.08);padding-top:24px;">
        <p>&copy; 2026 Uma Churrasqueira · +351 932 313 032 · <a href="index.html" style="color:var(--gold)">Back to Home</a></p>
      </div>
    </div>
  </footer>

  <script src="js/menu.js"></script>
  <script>
    const navToggle = document.getElementById('navToggle');
    const navLinks  = document.querySelector('.nav-links');
    const navbar    = document.getElementById('navbar');
    const navOverlay = document.getElementById('navOverlay');

    function openMenu() {
      navLinks.classList.add('open');
      navToggle.classList.add('open');
      navbar.classList.add('menu-open');
      if (navOverlay) navOverlay.classList.add('open');
    }
    function closeMenu() {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
      navbar.classList.remove('menu-open');
      if (navOverlay) navOverlay.classList.remove('open');
    }

    navToggle && navToggle.addEventListener('click', () => {
      navLinks.classList.contains('open') ? closeMenu() : openMenu();
    });
    navLinks && navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', closeMenu);
    });
    if (navOverlay) navOverlay.addEventListener('click', closeMenu);
    window.addEventListener('scroll', () => {
      if (navLinks.classList.contains('open')) closeMenu();
    }, { passive: true });
  </script>
</body>
</html>
